name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
        experimental: [false]
        include:
          # Not yet a supported target; a failure here should not block a pull request.
          - php: '8.5'
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: composer test
